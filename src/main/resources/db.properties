# Database Configuration File for Training Institute Management System
# Supported types: H2, SQLITE, MYSQL
db.type=H2

# H2 Database settings (Default, embedded file-based for persistence)
db.h2.url=jdbc:h2:./tanishq_institute;DB_CLOSE_DELAY=-1;MODE=MySQL
db.h2.username=sa
db.h2.password=

# SQLite settings (Alternative)
db.sqlite.url=jdbc:sqlite:tanishq_institute.db

# MySQL settings (Uncomment and configure to connect to your MySQL Server)
db.mysql.url=jdbc:mysql://localhost:3306/tanishq_institute?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.mysql.username=root
db.mysql.password=password123
